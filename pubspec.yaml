name: cascade_cli
description: >
  Official Cascade CLI — connect a Flutter app to the Cascade control plane
  (login, init, doctor). The control-plane website is separate and private.
version: 0.1.0
# Point this at the PUBLIC CLI-only GitHub repo before publishing.
# Do NOT link the private control-plane monorepo here.
# Note: pub.dev package id is cascade_cli (name "cascade" is reserved/moderated).
homepage: https://cascade.dev
repository: https://github.com/Asad06124/cascade-cli
issue_tracker: https://github.com/Asad06124/cascade-cli/issues

environment:
  sdk: ^3.5.0

executables:
  cascade: cascade

dependencies:
  args: ^2.7.0
  http: ^1.3.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
